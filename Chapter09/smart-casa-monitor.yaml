            text_color: 0xFFFFFF
            border_color: 0x87CEFA
            border_width: 2
            radius: 8

        - keyboard:
            id: editor_keyboard
            align: TOP_LEFT
            x: 0
            y: 150
            width: 320
            height: 250
            bg_color: 0x151515
            text_color: 0xFFFFFF
            on_ready:
              then:
                - lambda: |-
                    const char *edited = lv_textarea_get_text(id(txt_editor_value));

                    switch (id(active_edit_field)) {
                      case 1:
                        lv_textarea_set_text(id(txt_topic_1_name), edited);
                        break;
                      case 2:
                        lv_textarea_set_text(id(txt_topic_1_address), edited);
                        break;
                      case 3:
                        lv_textarea_set_text(id(txt_topic_2_name), edited);
                        break;
                      case 4:
                        lv_textarea_set_text(id(txt_topic_2_address), edited);
                        break;
                      case 5:
                        lv_textarea_set_text(id(txt_topic_3_name), edited);
                        break;
                      case 6:
                        lv_textarea_set_text(id(txt_topic_3_address), edited);
                        break;
                      case 7:
                        lv_textarea_set_text(id(txt_topic_4_name), edited);
                        break;
                      case 8:
                        lv_textarea_set_text(id(txt_topic_4_address), edited);
                        break;
                      case 9:
                        lv_textarea_set_text(id(txt_topic_5_name), edited);
                        break;
                      case 10:
                        lv_textarea_set_text(id(txt_topic_5_address), edited);
                        break;
                      case 11:
                        lv_textarea_set_text(id(txt_topic_6_name), edited);
                        break;
                      case 12:
                        lv_textarea_set_text(id(txt_topic_6_address), edited);
                        break;
                      case 13:
                        lv_textarea_set_text(id(txt_topic_7_name), edited);
                        break;
                      case 14:
                        lv_textarea_set_text(id(txt_topic_7_address), edited);
                        break;
                      case 15:
                        lv_textarea_set_text(id(txt_topic_8_name), edited);
                        break;
                      case 16:
                        lv_textarea_set_text(id(txt_topic_8_address), edited);
                        break;
                    }

                - if:
                    condition:
                      lambda: 'return id(return_settings_page) == 1;'
                    then:
                      - lvgl.page.show:
                          id: page_topic_settings_1
                    else:
                      - lvgl.page.show:
                          id: page_topic_settings_2

            on_cancel:
              then:
                - if:
                    condition:
                      lambda: 'return id(return_settings_page) == 1;'
                    then:
                      - lvgl.page.show:
                          id: page_topic_settings_1
                    else:
                      - lvgl.page.show:
                          id: page_topic_settings_2

interval:
  - interval: 60s
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            char time_str[6];
            snprintf(time_str, sizeof(time_str), "%02d:%02d", now.hour, now.minute);

            lv_label_set_text(id(lbl_time_page_1), time_str);
            lv_label_set_text(id(lbl_time_page_2), time_str);
          }


sensor:
  - platform: wifi_signal
    name: "Smart Multi Switch WiFi Signal"
    update_interval: 60s