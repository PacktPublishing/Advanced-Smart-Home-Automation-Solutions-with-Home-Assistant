esphome:
  name: smart-casa-monitor
  friendly_name: Smart Casa Monitor
  min_version: 2026.1.0
  platformio_options:
    build_flags:
      - "-DBOARD_HAS_PSRAM"
    board_build.flash_mode: qio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: -100
    then:
      - script.execute: reset_screen_timeout
      - lambda: |-
          lv_label_set_text(id(lbl_topic_1), id(topic_1_name).c_str());
          lv_textarea_set_text(id(txt_topic_1_name), id(topic_1_name).c_str());
          lv_textarea_set_text(id(txt_topic_1_address), id(topic_1_address).c_str());

          lv_label_set_text(id(lbl_topic_2), id(topic_2_name).c_str());
          lv_textarea_set_text(id(txt_topic_2_name), id(topic_2_name).c_str());
          lv_textarea_set_text(id(txt_topic_2_address), id(topic_2_address).c_str());

          lv_label_set_text(id(lbl_topic_3), id(topic_3_name).c_str());
          lv_textarea_set_text(id(txt_topic_3_name), id(topic_3_name).c_str());
          lv_textarea_set_text(id(txt_topic_3_address), id(topic_3_address).c_str());

          lv_label_set_text(id(lbl_topic_4), id(topic_4_name).c_str());
          lv_textarea_set_text(id(txt_topic_4_name), id(topic_4_name).c_str());
          lv_textarea_set_text(id(txt_topic_4_address), id(topic_4_address).c_str());

          lv_label_set_text(id(lbl_topic_5), id(topic_5_name).c_str());
          lv_textarea_set_text(id(txt_topic_5_name), id(topic_5_name).c_str());
          lv_textarea_set_text(id(txt_topic_5_address), id(topic_5_address).c_str());

          lv_label_set_text(id(lbl_topic_6), id(topic_6_name).c_str());
          lv_textarea_set_text(id(txt_topic_6_name), id(topic_6_name).c_str());
          lv_textarea_set_text(id(txt_topic_6_address), id(topic_6_address).c_str());

          lv_label_set_text(id(lbl_topic_7), id(topic_7_name).c_str());
          lv_textarea_set_text(id(txt_topic_7_name), id(topic_7_name).c_str());
          lv_textarea_set_text(id(txt_topic_7_address), id(topic_7_address).c_str());

          lv_label_set_text(id(lbl_topic_8), id(topic_8_name).c_str());
          lv_textarea_set_text(id(txt_topic_8_name), id(topic_8_name).c_str());
          lv_textarea_set_text(id(txt_topic_8_address), id(topic_8_address).c_str());

esp32:
  board: esp32s3box 
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: "your_api_key"

ota:
  - platform: esphome
    password: "your_ota_password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - lvgl.widget.show: icon_wifi_page_1
      - lvgl.widget.show: icon_wifi_page_2

  on_disconnect:
    then:
      - lvgl.widget.hide: icon_wifi_page_1
      - lvgl.widget.hide: icon_wifi_page_2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Smart-Casa-Monitor"
    password: "your_ap_password"

captive_portal:

mqtt:
  id: mqtt_client
  broker: "your_ip_broker_password"
  port: 1883
  username: "your_name"
  password: "your_password"
  discovery: false
  reboot_timeout: 0s
  log_topic: null
  on_connect:
    then:
      - lvgl.widget.show: icon_mqtt_page_1
      - lvgl.widget.show: icon_mqtt_page_2

  on_disconnect:
    then:
      - lvgl.widget.hide: icon_mqtt_page_1
      - lvgl.widget.hide: icon_mqtt_page_2

web_server:
  port: 80

# ------------------------------------------------------------
# I2C
# GPIO7 / GPIO8 are exposed as the board I2C pins in Waveshare's
# pinout image. I am using them for the touchscreen bus.
# ------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO7

# ------------------------------------------------------------
# LCD BACKLIGHT
# 
# ------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO6
    id: backlight_pwm

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# ------------------------------------------------------------
# SPI DISPLAY
# ------------------------------------------------------------
script:
  - id: reset_screen_timeout
    mode: restart
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - delay: 2min
      - light.turn_on:
          id: display_backlight
          brightness: 20%

  - id: settings_timeout
    mode: restart
    then:
      - delay: 5min
      - lvgl.page.show:
          id: page_1
# ------------------------------------------------------------
# SPI DISPLAY
# ------------------------------------------------------------
spi:
  - id: lcd_spi
    clk_pin: GPIO5
    mosi_pin: GPIO1
    miso_pin: GPIO2

display:
  - platform: mipi_spi
    id: main_display
    model: ST7796
    spi_id: lcd_spi
    #cs_pin: GPIO10
    dc_pin: GPIO3
    #reset_pin: GPIO14
    dimensions:
      width: 320
      height: 480
    #rotation: 0
    #color_order: bgr
    invert_colors: true

# ------------------------------------------------------------
# TOUCHSCREEN
# ------------------------------------------------------------
touchscreen:
  - platform: ft63x6
    id: main_touch
    display: main_display
    i2c_id: bus_a
    on_touch:
      then:
        - script.execute: reset_screen_timeout
        - script.execute: settings_timeout

binary_sensor:
  - platform: touchscreen
    id: touch_debug
    name: "Touch"
    x_min: 0
    x_max: 319
    y_min: 0
    y_max: 479
# ------------------------------------------------------------
# CAMERA
# These pins are exact from Waveshare's camera demo.
# Waveshare's example shows:
# XCLK=38, SIOD=8, SIOC=7, Y9=21, Y8=39, Y7=40, Y6=42,
# Y5=46, Y4=48, Y3=47, Y2=45, VSYNC=17, HREF=18, PCLK=41
# ------------------------------------------------------------
esp32_camera:
  id: cam
  name: Smart Casa Monitor Camera"

  external_clock:
    pin: GPIO38
    frequency: 20MHz

  i2c_id: bus_a

  data_pins:
    - GPIO45
    - GPIO47
    - GPIO48
    - GPIO46
    - GPIO42
    - GPIO40
    - GPIO39
    - GPIO21

  vsync_pin: GPIO17
  href_pin: GPIO18
  pixel_clock_pin: GPIO41

  # OV2640/OV5640 starting settings
  max_framerate: 12 fps
  idle_framerate: 0.2 fps
  resolution: 640x480
  jpeg_quality: 12
  contrast: 1
  brightness: 1
  saturation: 0
  vertical_flip: true
  horizontal_mirror: false

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

time:
  - platform: homeassistant
    id: ha_time

